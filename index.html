<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestureID</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0044ff">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <script type="module">
        import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";
        window.HandLandmarker = HandLandmarker;
        window.FilesetResolver = FilesetResolver;
        window.dispatchEvent(new Event('mediapipe-listo'));
    </script>
    <style>
        * { border: none !important; outline: none !important; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Video grande */
        #video-container { position: relative; width: 100%; max-width: 640px; aspect-ratio: 4/3; }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); border-radius: 24px; }
        
        /* Tarjetas grandes */
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            color: #1e293b;
        }

        .btn-principal {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
        }
        .btn-principal:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6);
        }

        .respuesta-btn {
            transition: all 0.2s ease;
            cursor: pointer;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 1rem;
        }
        .respuesta-btn:active {
            transform: scale(0.95);
            background: #eff6ff;
            border-color: #3b82f6;
        }
        
        .mano-animada {
            font-size: 4rem;
            line-height: 1;
            animation: saludar 2.5s ease-in-out infinite;
            display: inline-block;
            transform-origin: bottom center;
            filter: drop-shadow(0 6px 12px rgba(59, 130, 246, 0.5));
        }
        @keyframes saludar {
            0%, 100% { transform: rotate(-15deg) translateY(0); }
            25% { transform: rotate(15deg) translateY(-5px); }
            50% { transform: rotate(-10deg) translateY(0); }
            75% { transform: rotate(15deg) translateY(-5px); }
        }

        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .detectado-pulse { animation: pulse-blue 1s ease-out; }

        @keyframes rainbow {
            0% { color: #ef4444; } 25% { color: #f59e0b; } 50% { color: #10b981; } 75% { color: #3b82f6; } 100% { color: #8b5cf6; }
        }
        .texto-arcoiris { animation: rainbow 4s infinite; font-weight: 900; }
    </style>
</head>
<body>

    <div class="max-w-4xl w-full p-4 flex flex-col items-center">

        <header class="card w-full p-5 mb-6 flex items-center justify-center gap-4">
            <span class="mano-animada">🖐️</span>
            <div>
                <h1 class="text-4xl texto-arcoiris tracking-tight">GestureID</h1>
                <p class="text-gray-500 text-md font-medium">Comunicación sin Barreras</p>
            </div>
        </header>

        <main class="w-full flex flex-col items-center">
            
            <button id="start-btn" class="btn-principal px-10 py-4 rounded-2xl font-bold mb-6 text-xl flex items-center gap-2">
                🎥 Encender Cámara
            </button>

            <div id="video-container" class="card p-2 hidden mb-6">
                <video id="webcam" autoplay playsinline muted></video>
            </div>

            <div id="tarjeta-resultado" class="mb-6 w-full card p-8 text-center transition-all duration-300">
                <p class="text-gray-400 text-sm font-bold uppercase tracking-widest mb-2">Seña detectada</p>
                <h2 id="result-text" class="text-7xl texto-arcoiris mb-2">
                    ---
                </h2>
                <p id="status-text" class="text-sm text-gray-500 font-medium mt-3">Esperando...</p>
                <div id="debug-text" class="text-[10px] text-gray-400 mt-2"></div>
            </div>

            <div id="panel-respuestas" class="w-full card p-6">
                <h3 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2 border-b pb-2">
                    <span>💬</span> Toca para responder
                </h3>
                <div id="lista-respuestas" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <p class="text-gray-400 text-md col-span-2 text-center py-4">
                        Haz una seña para ver las respuestas
                    </p>
                </div>
            </div>

        </main>
    </div>

    <script src="renderer.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
</body>
</html>
